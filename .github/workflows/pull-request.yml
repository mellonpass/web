name: PR test

on:
  pull_request:
    branches: ["main", "demo"]
  push:
    branches: ["main"]

env:
  PUBLIC_SERVER_URL: "http://localhost:8000"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run type check
        run: npm run check
      - name: Run E2EE unit tests
        run: npm test
      - name: Verify production build
        run: npm run build
